[project]
name = "mcpack-localizer"
version = "1.1.0"
description = "整合包本地化工具 - A toolset to assist in translating Minecraft modpacks into Chinese"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [
    { name = "XDawned" },
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "PyQt6==6.7.0",
    "PyQt6-Fluent-Widgets[full]>=1.7",
    "PyQt6-Frameless-Window>=0.3",
    "pywin32>=306; sys_platform == 'win32'",
    "nbt>=1.5",
    "snbtlib>=1.0",
    "openai>=1.0",
    "requests>=2.31",
    "pyahocorasick>=2.0",
    "func-timeout>=4.3",
]

[project.scripts]
mcpack-localizer = "main:__main__"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "components", "view", "resource"]
include = ["main.py"]

[tool.uv]
