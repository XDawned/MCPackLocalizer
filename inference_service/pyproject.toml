[project]
name = "mcpack-localizer-inference"
version = "1.1.0"
description = "本地推理服务 - 本地 MarianMT 翻译推理后端（独立 uv 环境，供主程序通过 HTTP 调用）"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [
    { name = "XDawned" },
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "transformers>=4.30",
    "torch>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
mcpack-localizer-inference = "server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
include = ["server.py"]

[tool.uv]
package = true
